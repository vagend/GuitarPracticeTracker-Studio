# Builds Guitar Practice Studio for Windows (installer) and Mac (one app for Apple Silicon and Intel).
#   push to main -> the public app, published as the "latest" release (what everyone's Studio updates from)
#   push to test -> Guitar Practice Studio Test, a separate app with its own data, published as the
#                   "test-build" pre-release (tag test-build: a tag named "test" would clash with the
#                   test branch); only the test app updates from it, the public app never sees it.
#                   Pushes to test build Windows only: the Mac is tested with local builds
#                   (Build Studio Test (Mac).command), and GitHub's Mac machines are often busy.
#                   A full test build (Mac too): Actions > Build Guitar Practice Studio > Run workflow
#                   on the test branch (or: gh workflow run release.yml --ref test).
# Each app checks its own release's BUILD.txt to offer updates.
name: Build Guitar Practice Studio

on:
  push:
    branches: [main, test]
    paths-ignore:   # changing only these doesn't need an app build
      - "**.md"
      - .gitignore
      - LICENSE
      - "Build Studio (Mac).command"
      - "Build Studio Test (Mac).command"
      - web/vendor/alphatab.version
      - .github/workflows/vendor-alphatab.yml
  workflow_dispatch:   # lets you start a build from the Actions tab

permissions:
  contents: write      # needed to publish the release

concurrency:
  group: build-${{ github.ref }}   # a newer push replaces a build of the same branch only
  cancel-in-progress: true

env:
  JUCE_VERSION: "9.0.5"
  WEBVIEW2_VERSION: "1.0.3485.44"
  CHANNEL: ${{ github.ref == 'refs/heads/test' && 'test' || 'public' }}
  APP:     ${{ github.ref == 'refs/heads/test' && 'Guitar Practice Studio Test' || 'Guitar Practice Studio' }}
  FILES:   ${{ github.ref == 'refs/heads/test' && 'GuitarPracticeStudioTest' || 'GuitarPracticeStudio' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE and WebView2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external | Out-Null
          Invoke-WebRequest "https://github.com/juce-framework/JUCE/archive/refs/tags/$env:JUCE_VERSION.tar.gz" -OutFile juce.tar.gz
          tar -xzf juce.tar.gz -C external
          Rename-Item "external/JUCE-$env:JUCE_VERSION" JUCE
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nuget" | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_VERSION" -OutFile "$env:RUNNER_TEMP\webview2.zip"
          Expand-Archive "$env:RUNNER_TEMP\webview2.zip" "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          Get-ChildItem "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION\build\native"

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DSTUDIO_BUILD=${{ github.run_number }} "-DSTUDIO_CHANNEL=$env:CHANNEL" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\nuget"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "build\GuitarPracticeStudio_artefacts\Release"

      - name: Check the app opens
        shell: pwsh
        run: |
          $p = Start-Process "build\GuitarPracticeStudio_artefacts\Release\$env:APP.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "Studio closed by itself (exit code $($p.ExitCode))" }
          Stop-Process $p -Force
          "Studio stayed open"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (!(Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          $test = @(); if ($env:CHANNEL -eq 'test') { $test = @('/DTest') }
          & $iscc @test "/DAppVersion=0.7.${{ github.run_number }}" "/DSourceDir=$PWD\build\GuitarPracticeStudio_artefacts\Release" "/O$PWD\dist" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\$env:APP"
          # -Wait would also wait for Studio, which the installer opens at the end
          $s = Start-Process "dist\$env:FILES-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (!$s.WaitForExit(300000)) { throw "installer didn't finish within 5 minutes" }
          Start-Sleep 5
          if (!(Get-Process $env:APP -ErrorAction SilentlyContinue)) { throw "installer didn't open Studio" }
          if (!(Test-Path "$app\$env:APP.exe")) { throw "app not installed" }
          if (!(Test-Path "$app\web\index.html")) { throw "web files not installed" }
          Get-Process $env:APP -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -eq $env:APP
          if (!$u) { throw "not listed under Apps" }
          "Installed: $($u.DisplayName) $($u.DisplayVersion)"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: dist/${{ env.FILES }}-setup.exe
          if-no-files-found: error
          retention-days: 3

  mac:
    if: github.ref != 'refs/heads/test' || github.event_name == 'workflow_dispatch'   # see the top
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: |
          mkdir -p external
          curl -fsSL --retry 3 "https://github.com/juce-framework/JUCE/archive/refs/tags/$JUCE_VERSION.tar.gz" | tar xz -C external
          mv "external/JUCE-$JUCE_VERSION" external/JUCE

      - name: Build (Apple Silicon and Intel in one app)
        run: |
          cmake -S . -B build -G Xcode -DSTUDIO_BUILD=${{ github.run_number }} -DSTUDIO_CHANNEL=$CHANNEL "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --config Release -- -quiet
          APP="build/GuitarPracticeStudio_artefacts/Release/$APP.app"
          # ad-hoc signature: without one, macOS won't offer "Open Anyway" for a downloaded app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/${{ env.APP }}"
          test -f "$APP/Contents/Resources/web/index.html"

      - name: Check the app opens
        run: |
          "build/GuitarPracticeStudio_artefacts/Release/$APP.app/Contents/MacOS/$APP" &
          pid=$!
          sleep 15
          kill -0 $pid || { echo "Studio closed by itself"; exit 1; }
          kill $pid
          echo "Studio stayed open"

      - name: Zip and disk image
        run: |
          NAME="$APP"
          APP="build/GuitarPracticeStudio_artefacts/Release/$NAME.app"
          mkdir -p dist
          # zip: what Studio downloads to update itself. ditto keeps permissions, links and signature.
          ditto -c -k --keepParent "$APP" "dist/$FILES-mac.zip"
          # dmg: for first installs, with an Applications shortcut to drag the app onto
          S="$RUNNER_TEMP/dmg"; mkdir -p "$S"
          ditto "$APP" "$S/$NAME.app"
          ln -s /Applications "$S/Applications"
          for i in 1 2 3; do   # hdiutil is sometimes "busy" on CI machines
            hdiutil create -volname "$NAME" -srcfolder "$S" -ov -format UDZO "dist/$FILES-mac.dmg" && break
            sleep 5
          done
          test -f "dist/$FILES-mac.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: studio-mac
          path: |
            dist/${{ env.FILES }}-mac.zip
            dist/${{ env.FILES }}-mac.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: out

      # The release is updated in place, never deleted first: if GitHub fails partway (an outage),
      # the previous build stays up. BUILD.txt goes last, so Studio only offers the build once its files are there.
      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "${{ github.run_number }}" > out/BUILD.txt   # what Studio reads to see if it's out of date
          ls -la out
          title="Guitar Practice Studio (build ${{ github.run_number }})"
          cat > notes.md <<EOF
          Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Windows:** download **GuitarPracticeStudio-setup.exe** and run it. It installs just for you (no admin needed), adds Guitar Practice Studio to the Start menu, and can be uninstalled from Settings > Apps.
          Windows SmartScreen may warn that the app isn't from a known publisher: click **More info > Run anyway**.

          **Mac:** download **GuitarPracticeStudio-mac.dmg** (works on Apple Silicon and Intel Macs), open it and drag **Guitar Practice Studio** onto **Applications**.
          The first time, macOS says it can't verify the app: click **Done**, open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**.
          (GuitarPracticeStudio-mac.zip is what Studio uses to update itself.)

          After that, Studio offers new builds itself: Settings > Studio > Check for updates.
          EOF
          sed -i 's/^          //' notes.md
          files="out/GuitarPracticeStudio-setup.exe out/GuitarPracticeStudio-mac.dmg out/GuitarPracticeStudio-mac.zip"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest $files --clobber
            gh release upload latest out/BUILD.txt --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --title "$title" --notes-file notes.md --latest
          else
            gh release create latest $files out/BUILD.txt --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
          fi

  release-test:
    needs: [windows, mac]
    # publishes when Windows built; the Mac files go in too when the Mac was built (a full test build)
    if: always() && github.ref == 'refs/heads/test' && needs.windows.result == 'success' && needs.mac.result != 'failure' && needs.mac.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: out

      # Updated in place like the public release (see above). A Windows-only build takes the Mac files
      # off, so a Mac file from an older full build is never left next to a newer Windows one.
      - name: Publish the test build (a pre-release, never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "${{ github.run_number }}" > out/BUILD.txt
          ls -la out
          files="out/GuitarPracticeStudioTest-setup.exe"
          mac="Windows only: the Mac test app is built locally."
          if [ -f out/GuitarPracticeStudioTest-mac.dmg ]; then
            files="$files out/GuitarPracticeStudioTest-mac.dmg out/GuitarPracticeStudioTest-mac.zip"
            mac="Mac: GuitarPracticeStudioTest-mac.dmg. Windows: GuitarPracticeStudioTest-setup.exe."
          fi
          title="Guitar Practice Studio Test (build ${{ github.run_number }}, work in progress)"
          cat > notes.md <<EOF
          **Work in progress, not for general use.** Built from the test branch (${GITHUB_SHA::7}) on $(date -u '+%Y-%m-%d %H:%M') UTC.

          Installs as a separate app, **Guitar Practice Studio Test**, next to the normal one, with its own practice log, exercises and settings. The normal app never updates to these builds.
          $mac
          Get the normal app from the Latest release instead.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build $files --clobber
            if [ ! -f out/GuitarPracticeStudioTest-mac.dmg ]; then
              gh release delete-asset test-build GuitarPracticeStudioTest-mac.dmg --yes 2>/dev/null || true
              gh release delete-asset test-build GuitarPracticeStudioTest-mac.zip --yes 2>/dev/null || true
            fi
            gh release upload test-build out/BUILD.txt --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/test-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit test-build --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            gh release create test-build $files out/BUILD.txt --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
