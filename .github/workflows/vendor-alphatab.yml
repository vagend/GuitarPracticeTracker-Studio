# Copies a pinned version of alphaTab (tab and notation display, MPL-2.0) into web/vendor/alphatab,
# so Studio's builds never download it and keep working even if alphaTab disappears.
# To change versions, edit web/vendor/alphatab.version on the test branch and push: this runs and
# commits the files back to test (try it there, then release).
name: Vendor alphaTab

on:
  push:
    branches: [test]
    paths: [web/vendor/alphatab.version, .github/workflows/vendor-alphatab.yml]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch alphaTab
        run: |
          set -e
          V="$(tr -d ' \n\r' < web/vendor/alphatab.version)"; echo "V=$V" >> "$GITHUB_ENV"
          npm pack "@coderline/alphatab@$V"
          tar xzf coderline-alphatab-$V.tgz
          echo "package contents:"; find package -maxdepth 2 | sort
          D=web/vendor/alphatab
          rm -rf "$D"; mkdir -p "$D"
          # The runtime files only: scripts, fonts and the sound bank (no type definitions, source maps
          # or the add-ons for website build tools).
          rsync -a --exclude '*.d.ts' --exclude '*.map' --exclude '*.vite.*' --exclude '*.webpack.*' package/dist/ "$D/"
          cp package/LICENSE* "$D/" 2>/dev/null || true
          cat > "$D/SOURCE.md" <<NOTE
          # alphaTab $V

          Unmodified files from the npm package @coderline/alphatab@$V (dist folder), licensed under the
          Mozilla Public License 2.0 (see LICENSE). Source code: https://github.com/CoderLine/alphaTab
          (tag v$V). Copied here by .github/workflows/vendor-alphatab.yml on $(date -u '+%Y-%m-%d').
          NOTE
          sed -i 's/^          //' "$D/SOURCE.md"
          du -sh "$D"; find "$D" -type f | sort

      - name: Commit
        run: |
          git config user.name "vagend"
          git config user.email "33006883+vagend@users.noreply.github.com"
          git add web/vendor/alphatab
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Vendor alphaTab $V (MPL-2.0) into web/vendor/alphatab [skip ci]"
          git push
